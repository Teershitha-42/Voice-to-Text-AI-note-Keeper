<!-- views/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AI Keeper</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box glass">
      <h2><span class="logo">🔊</span> Welcome, Tishi ✨</h2>
      <form action="/login" method="POST">
        <input type="text" name="username" placeholder="👩‍💻 Username" required />
        <input type="password" name="password" placeholder="🔒 Password" required />
        <button type="submit">Login</button>
      </form>
      <p class="footer">🎧 Voice-to-Text AI Keeper by <span class="tishi">Tishi</span></p>
    </div>
  </div>
</body>
</html>
